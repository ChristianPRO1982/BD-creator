services:
  api:
    build:
      context: .
    command: uv run uvicorn app.main:app --app-dir /app/api --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - minio
      - auth_mock
    networks:
      - default
      - shared_backend

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - /web/node_modules
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bd_creator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  auth_mock:
    image: python:3.12-slim
    working_dir: /srv
    command: sh -c "pip install fastapi uvicorn && uvicorn app:app --host 0.0.0.0 --port 8001"
    env_file:
      - .env.dev
    environment:
      AUTH_MOCK_SHARED_SECRET: dev-shared-secret
    volumes:
      - ./tools/auth_mock:/srv
    ports:
      - "8001:8001"

volumes:
  pg_data:
  minio_data:

networks:
  shared_backend:
    external: true
    name: ${SHARED_DB_NETWORK:-pg-carthographie_backend}
