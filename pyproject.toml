[project]
name = "bd-creator"
version = "0.1.0"
description = "BD Creator V1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "gunicorn>=23.0.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.4",
  "playwright>=1.51.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["api"]
asyncio_mode = "auto"
